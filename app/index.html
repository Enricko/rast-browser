<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Browser</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    display: flex; flex-direction: column;
    background: #f2f3f7; color: #1e2430;
    font: 14px/1.4 Inter, "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #17181c; color: #e9ecf2; }
    .toolbar, .status { background: #20222a; border-color: #30343d; }
    .toolbar input { background: #15171c; color: #e9ecf2; border-color: #3a3f4b; }
    button { background: #262a33; color: #e9ecf2; }
    button:hover { background: #303541; }
  }
  .toolbar {
    display: flex; gap: 8px; align-items: center;
    padding: 8px 10px; background: #fff; border-bottom: 1px solid #d8dbe4;
  }
  button {
    appearance: none; border: 0; cursor: pointer; border-radius: 8px;
    min-width: 34px; height: 32px; background: #eceef4; color: #1e2430;
    font: 500 15px/1 Inter, system-ui, sans-serif;
  }
  button:hover { background: #e2e5ee; }
  button:disabled { opacity: .4; cursor: default; }
  .address { display: flex; flex: 1; gap: 8px; align-items: center; }
  .toolbar input {
    flex: 1; height: 32px; padding: 0 12px; border-radius: 8px;
    border: 1px solid #ccd1dd; background: #fff; color: inherit;
    font: 14px/1 Inter, system-ui, sans-serif; outline: none;
  }
  .toolbar input:focus { border-color: #3b82f6; }
  .frame-wrap { flex: 1; position: relative; background: #fff; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
  .status {
    min-height: 26px; display: flex; align-items: center; gap: 8px;
    padding: 4px 12px; background: #fff; border-top: 1px solid #d8dbe4;
    color: #5a6474; font-size: 12px; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis;
  }
  .status.error { color: #c0392b; }
</style>
</head>
<body>
<header class="toolbar">
  <button id="back" type="button" title="Back" aria-label="Back">‹</button>
  <button id="forward" type="button" title="Forward" aria-label="Forward">›</button>
  <button id="reload" type="button" title="Reload" aria-label="Reload">⟳</button>
  <button id="home" type="button" title="Home" aria-label="Home">⌂</button>
  <form class="address" id="address-form">
    <input id="address" type="text" inputmode="url" spellcheck="false" autocomplete="off"
           aria-label="Address" placeholder="Search or enter a web address">
    <button type="submit">Go</button>
  </form>
</header>
<div class="frame-wrap"><iframe id="page" sandbox="allow-scripts allow-forms" referrerpolicy="no-referrer" title="Web page"></iframe></div>
<footer class="status" id="status">Ready</footer>
<script>
(() => {
  const frame = document.getElementById("page");
  const address = document.getElementById("address");
  const status = document.getElementById("status");
  const back = document.getElementById("back");
  const forward = document.getElementById("forward");
  const reload = document.getElementById("reload");
  const home = document.getElementById("home");
  const HOME = "https://en.wikipedia.org/wiki/Main_Page";
  let history = [];
  let index = -1;
  let current = "";

  const setStatus = (text, error = false) => {
    status.textContent = text;
    status.classList.toggle("error", error);
  };
  const updateButtons = () => {
    back.disabled = index <= 0;
    forward.disabled = index < 0 || index >= history.length - 1;
  };
  const proxy = (url) => `/api/browser/page?url=${encodeURIComponent(url)}`;
  const normalize = (input) => {
    const value = input.trim();
    if (!value) return null;
    if (/^https:\/\//i.test(value)) return value;
    if (/^http:\/\//i.test(value)) return value.replace(/^http:/i, "https:");
    if (/^[a-z][a-z0-9+.-]*:/i.test(value)) return null;
    const looksLikeAddress = /^[^\s/]+\.[^\s/]+/.test(value);
    if (!looksLikeAddress) {
      return `https://duckduckgo.com/html/?q=${encodeURIComponent(value)}`;
    }
    return `https://${value}`;
  };
  const show = (url, push) => {
    if (!url) return;
    current = url;
    address.value = url;
    if (push) {
      history = history.slice(0, index + 1);
      history.push(url);
      index = history.length - 1;
    }
    updateButtons();
    setStatus(`Loading ${url}…`);
    frame.src = proxy(url);
  };
  const navigate = (input) => {
    const url = normalize(input);
    if (!url) {
      setStatus("Enter an https:// address.", true);
      return;
    }
    show(url, true);
  };
  document.getElementById("address-form").addEventListener("submit", (event) => {
    event.preventDefault();
    navigate(address.value);
  });
  back.addEventListener("click", () => {
    if (index > 0) {
      index -= 1;
      show(history[index], false);
    }
  });
  forward.addEventListener("click", () => {
    if (index < history.length - 1) {
      index += 1;
      show(history[index], false);
    }
  });
  reload.addEventListener("click", () => {
    if (current) {
      setStatus(`Reloading ${current}…`);
      frame.src = proxy(current);
    }
  });
  home.addEventListener("click", () => show(HOME, true));
  frame.addEventListener("load", () => {
    setStatus(`Showing ${current}`);
  });
  window.addEventListener("message", (event) => {
    if (event.source !== frame.contentWindow) return;
    const data = event.data;
    if (!data || data.type !== "rast-browser-navigate" || typeof data.url !== "string") return;
    if (!/^https:\/\//i.test(data.url)) return;
    show(data.url, true);
  });
  window.addEventListener("error", (event) => setStatus(String(event.message || "Load failed"), true));
  show(HOME, true);
})();
</script>
</body>
</html>
